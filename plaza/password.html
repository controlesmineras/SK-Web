<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d59"><title>Crear contraseña · Plaza Blending</title><link rel="apple-touch-icon" href="../icons/icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#173d59;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 18px 50px #173d5920}h1{margin:0 0 8px;font-size:1.55rem}p{line-height:1.45;color:#587080}.user{background:#eef3f6;border-radius:14px;padding:14px 16px;margin:20px 0}.user small{display:block;font-weight:700;letter-spacing:.06em}.user strong{display:block;font-size:1.25rem;margin-top:4px}label{display:block;font-weight:700;font-size:.82rem;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #b8c6cf;border-radius:10px;font-size:1rem}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:#173d59;color:#fff;font-weight:800;font-size:.95rem}.status{margin-top:16px}.fine{font-size:.78rem;text-align:center}.ok{text-align:center}.ok b{display:block;font-size:1.2rem;color:#173d59}.ok a{display:block;margin-top:18px;padding:13px;border-radius:11px;background:#173d59;color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class="card"><div id="loading"><h1>CREAR CONTRASEÑA</h1><p>Verificando tu enlace personal…</p></div><div id="setup" hidden><h1>CREAR CONTRASEÑA</h1><p>Define la contraseña que usarás para ingresar a Plaza Blending.</p><div class="user"><small>USUARIO</small><strong id="document"></strong><small>Este será tu usuario para iniciar sesión.</small></div><form id="form"><label>NUEVA CONTRASEÑA</label><input name="password" type="password" minlength="6" autocomplete="new-password" required><label>CONFIRMAR CONTRASEÑA</label><input name="confirm" type="password" minlength="6" autocomplete="new-password" required><button>CREAR CONTRASEÑA</button></form><p class="fine">Este enlace es personal, temporal y puede utilizarse una sola vez.</p></div><div id="result" hidden class="ok"></div><p id="status" class="status"></p></main><script src="../sync-config.js?v=20260915-2"></script><script>(()=>{'use strict';const $=s=>document.querySelector(s),token=new URLSearchParams(location.search).get('token')||'',api=()=>window.SK_SYNC_CONFIG?.apiUrl||'';async function post(body){if(!api())throw new Error('El servicio de acceso no está configurado.');const r=await fetch(api(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}),text=await r.text();let x;try{x=JSON.parse(text)}catch(_){throw new Error('No fue posible validar el enlace.')}if(!x.ok)throw new Error(x.error||'No fue posible validar el enlace.');return x}function fail(e){$('#loading').hidden=true;$('#setup').hidden=true;$('#status').textContent=e?.message||String(e)}async function init(){try{if(!token)throw new Error('Este enlace no es válido.');const x=await post({action:'plazaInviteInfo',token});$('#document').textContent=x.document;$('#loading').hidden=true;$('#setup').hidden=false}catch(e){fail(e)}}$('#form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,p=f.elements.password.value,c=f.elements.confirm.value;if(p!==c)return $('#status').textContent='Las contraseñas no coinciden.';if(p.length<6)return $('#status').textContent='La contraseña debe tener al menos 6 caracteres.';f.querySelector('button').disabled=true;$('#status').textContent='Guardando…';try{await post({action:'plazaSetPassword',token,password:p});$('#setup').hidden=true;$('#status').textContent='';$('#result').hidden=false;$('#result').innerHTML='<b>ACCESO CONFIGURADO CORRECTAMENTE</b><p>Tu documento es tu usuario. Ya puedes iniciar sesión con la contraseña que acabas de crear.</p><a href="./">IR A PLAZA BLENDING</a>'}catch(err){fail(err)}finally{f.querySelector('button').disabled=false}});init()})();</script></body></html>
