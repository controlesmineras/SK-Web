<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d59"><title>Plaza Blending</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="plaza.css"><link rel="stylesheet" href="plaza-pending.css?v=20260913-1"><link rel="stylesheet" href="plaza-collaborator.css?v=20260913-1"></head><body>
<header><div><strong>PLAZA BLENDING</strong><small>Ingresos y entregas · SK Web</small></div><div class="headerSync"><span id="pendingBadge" class="pendingBadge" hidden></span><button id="syncBtn" hidden>☁ Sincronizar</button></div></header>
<main><section id="login" class="panel"><h1>Iniciar sesión</h1><p>Usa el documento y PIN asignados por el administrador de SK Web.</p><form id="loginForm"><label>DOCUMENTO<input name="document" inputmode="numeric" autocomplete="username" required></label><label>PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button>ENTRAR</button></form><p id="loginStatus" class="status"></p></section>
<section id="app" hidden><div class="welcome"><div><b id="userName"></b><small id="syncStatus">Preparando datos…</small></div><button id="logoutBtn">Salir</button></div><nav><button data-view="income" class="active">INGRESOS</button><button data-view="delivery">ENTREGAS</button></nav>
<section id="income" class="view active"><h2>Registrar ingreso</h2><form id="incomeForm"><label>ELEMENTO<select name="itemId" required></select></label><label>CANTIDAD<input name="quantity" type="number" min="0.01" step="any" required></label><label>OBSERVACIONES<textarea name="notes"></textarea></label><button>GUARDAR INGRESO</button></form></section>
<section id="delivery" class="view"><h2>Registrar entrega</h2><form id="deliveryForm"><label>ELEMENTO<select name="itemId" required></select></label><label>CANTIDAD<input name="quantity" type="number" min="0.01" step="any" required></label><label>RECEPTOR<input id="recipientSearch" type="search" list="recipientOptions" autocomplete="off" placeholder="Buscar por documento o nombre…" required><datalist id="recipientOptions"></datalist><input name="recipientId" id="recipientId" type="hidden"></label><button type="button" id="newRecipientBtn" class="secondaryAction">+ Registrar colaborador</button><label>DESTINO<select name="destination" required><option value="">Seleccionar…</option><option>Operación</option><option>Traslado</option><option>Reparación</option></select></label><label>OBSERVACIONES<textarea name="notes"></textarea></label><button>GUARDAR ENTREGA</button></form></section>
<p class="permission">Acceso operativo: únicamente Ingresos y Entregas.</p></section><section id="collaboratorDialog" class="collaboratorDialog" hidden><div class="collaboratorPanel"><div class="dialogHead"><h2>Registrar colaborador</h2><button type="button" id="closeCollaboratorBtn" aria-label="Cerrar">×</button></div><p>Todos los campos son obligatorios.</p><form id="plazaCollaboratorForm"><label>DOCUMENTO<input name="documento" inputmode="numeric" required></label><label>NOMBRES Y APELLIDOS<input name="nombre" required></label><label>EMPRESA<select name="empresa" required><option value="">Seleccionar…</option><option>SK 3.7</option><option>DESMIN</option></select></label><label>ÁREA<select name="area" required><option value="">Seleccionar…</option><option>Seguridad física</option><option>Desmin - Obras civiles</option><option>Producción</option><option>Administrativa</option></select></label><label>CARGO<input name="cargo" required></label><button>GUARDAR COLABORADOR</button></form></div></section></main><script src="../sync-config.js"></script><script src="plaza.js?v=20260913-3"></script><script src="plaza-collaborator.js?v=20260913-1"></script></body></html>
