<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102f45"><link rel="manifest" href="manifest.webmanifest">
<title>Producción SK 3.7</title><link rel="stylesheet" href="../styles.css">
<style>
[hidden]{display:none!important}main{max-width:900px;margin:auto}header{justify-content:space-between}section{margin:16px 0}fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}form{margin:12px 0}label{min-width:0}select,input{max-width:100%}.productionActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.productionActions button{min-height:48px}.tableWrap{overflow:auto}li{margin:6px 0}#status{white-space:pre-wrap}details{margin:12px 0}summary{cursor:pointer;font-weight:700}
</style>
<script defer src="../sync-config.js"></script><script defer src="../spare-catalog.js"></script><script defer src="app.js?v=1"></script><script defer src="../consumption-query-v2.js"></script>
</head>
<body>
<header><strong>Producción · SK 3.7</strong><button id="logout" type="button" hidden>Cerrar sesión</button></header>
<main>
<p id="status" role="status" aria-live="polite"></p>
<section id="access">
<h2>Acceso a Producción</h2>
<form id="login"><label>Documento<input name="document" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form>
<form id="activate" hidden><h3>Crear contraseña</h3><label>Documento<input name="document" readonly required></label><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button>Activar acceso</button></form>
</section>
<section id="workspace" hidden>
<p id="operator"></p><button id="sync" type="button">Sincronizar</button>
<h2>Consumo de repuestos</h2>
<form id="record">
<label>Tipo de equipo<select name="tipoEquipo"><option>YT</option><option>Columna</option></select></label>
<label>Máquina<select name="assetId" required></select></label>
<label>Fecha<input name="fechaISO" type="date" required></label>
<label>Buscar responsable<input id="personSearch" type="search" placeholder="Nombre o documento"></label>
<label>Responsable<select name="responsableId" required></select></label>
<label>Inventario de origen<select name="origen"><option value="29">29</option><option value="28">28</option></select></label>
<label>Buscar repuesto<input id="partSearch" type="search" placeholder="Ítem o nombre"></label>
<label>Repuesto<select name="partId"></select></label>
<label>Cantidad<input name="cantidad" type="number" min="1" step="1" value="1"></label>
<ul id="draft"></ul>
<div class="productionActions"><button type="button" id="addPart">+ Agregar repuesto</button><button type="submit">Guardar consumos</button></div>
</form>
<details><summary>Personal</summary><input id="directorySearch" type="search" placeholder="Buscar nombre o documento"><ul id="directory"></ul></details>
<details><summary>Consumos registrados</summary><div class="tableWrap"><table><thead><tr><th>Fecha</th><th>Máquina</th><th>Inventario</th><th>Repuesto</th><th>Cantidad</th><th>Estado</th></tr></thead><tbody id="history"></tbody></table></div></details>
<details><summary>Consultas y exportación de consumos</summary><section id="queries"></section></details>
<details><summary>Entregas de Plaza Blending a Producción</summary><ul id="deliveries"></ul></details>
</section>
</main></body></html>
