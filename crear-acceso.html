<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear acceso · SK Web</title><style>body{font:16px system-ui,sans-serif;background:#edf3f7;color:#17384f;min-height:100vh;display:grid;place-items:center;margin:0;padding:16px;box-sizing:border-box}main{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:26px;box-sizing:border-box;box-shadow:0 12px 36px #17384f24}h1{font-size:1.5rem}label{display:block;margin:16px 0;font-weight:700}input{display:block;width:100%;box-sizing:border-box;min-height:46px;margin-top:5px;padding:9px;border:1px solid #9fb1bd;border-radius:8px;font:inherit}button{background:#173d59;color:white;width:100%;border:0;border-radius:8px;min-height:48px;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{min-height:25px}small{color:#596d78}</style></head><body><main><h1>CREAR ACCESO</h1><p id="intro">Comprobando invitación…</p><form id="form" hidden><label>DOCUMENTO (USUARIO)<input name="document" inputmode="numeric" autocomplete="username" required></label><label>CREA TU CONTRASEÑA<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>CONFIRMA TU CONTRASEÑA<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button>CREAR USUARIO</button><p><small>El enlace solo se puede usar una vez y vence 24 horas después de generarse.</small></p></form><p id="status" role="status"></p></main><script src="sync-config.js"></script><script src="crear-acceso.js"></script></body></html>
